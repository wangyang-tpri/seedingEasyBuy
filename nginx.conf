# ============================================================
# 苗木易购 H5 生产环境 Nginx 配置
# 作用：静态资源服务 + /api 反向代理（同源，彻底解决跨域）
# 用法：
#   1. 前端构建：npm run build:h5  →  产物在 dist/build/h5/
#   2. 将 dist/build/h5/ 下的所有文件拷贝到 root 指向的目录
#   3. 将本文件放到 nginx/conf/ 下，或在 nginx.conf 的 http 块中 include
#   4. 重启 nginx：nginx -s reload
# ============================================================

server {
    listen       80;
    server_name  _;   # 改成实际域名或 IP，如 nursery.example.com

    # 字符集
    charset utf-8;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;
    gzip_vary on;

    # ---------- 静态资源根目录 ----------
    # Windows 示例：root D:/nursery/treeWeb/nursery/dist/build/h5;
    # Linux 示例：  root /usr/share/nginx/html;
    root   /usr/share/nginx/html;
    index  index.html;

    # ---------- API 反向代理（核心：同源，无跨域） ----------
    # 前端 H5 生产环境 baseUrl = /api（相对路径），请求发到同源 nginx
    # nginx 转发到后端实际地址，浏览器全程感知不到跨域
    location /api/ {
        proxy_pass http://10.218.72.69:8080/api/;   # 改成后端实际地址

        # 传递真实客户端信息（后端日志/限流需要）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # 后端如果是 HTTP/1.1 keepalive 优化
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ---------- SPA 路由兜底 ----------
    # uni-app H5 默认 hash 模式，本配置非必须；
    # 若将来切到 history 模式，必须有这一行，否则刷新子页面 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 静态资源长缓存 ----------
    # 带 hash 的 js/css/图片等，文件名随内容变化，可安全长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp4|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- html 不缓存（保证发版后用户拿到最新入口） ----------
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
}
